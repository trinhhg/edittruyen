<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trịnh Hg Utility - Pro Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="app-container">
    <aside class="main-sidebar">
      <div class="sidebar-logo">
        <h2>Trịnh Hg</h2>
        <span>v22.0 Professional</span>
      </div>
      <nav class="nav-menu">
        <button class="nav-item active" data-tab="settings">
          <i>⚙️</i> <span>Cài Đặt</span>
        </button>
        <button class="nav-item" data-tab="replace">
          <i>🔄</i> <span>Thay Thế</span>
        </button>
        <button class="nav-item" data-tab="split">
          <i>✂️</i> <span>Chia Chương</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="donate-card">
          <p>DON@TE</p>
          <strong>MB BANK</strong>
          <span>0917678211</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <button id="mobile-toggle" class="mobile-only">☰</button>
        <h1 id="page-title">Cài Đặt Hệ Thống</h1>
      </header>

      <section id="settings" class="tab-pane active">
        <div class="settings-layout">
          <aside class="settings-sidebar">
            <div class="sidebar-group">
              <label>Chế độ hoạt động</label>
              <select id="mode-select" class="form-select"></select>
              <div class="mode-actions-grid">
                <button id="add-mode" class="btn btn-sm">+ Mới</button>
                <button id="rename-mode" class="btn btn-sm">Đổi tên</button>
                <button id="delete-mode" class="btn btn-danger btn-sm">Xóa</button>
              </div>
            </div>

            <div class="sidebar-group">
              <label>Cấu hình tìm kiếm</label>
              <button id="match-case" class="btn-toggle-sid">Match Case</button>
              <button id="whole-word" class="btn-toggle-sid">Whole Word</button>
              <button id="auto-caps" class="btn-toggle-sid">Auto Caps</button>
            </div>

            <div class="sidebar-group">
                <label>Chuẩn hóa Format</label>
                <div class="format-options">
                    <label class="format-card">
                        <input type="radio" name="format-mode" value="none" checked>
                        <div class="format-info">
                            <strong>Không đổi</strong>
                            <p>Giữ nguyên gốc</p>
                        </div>
                    </label>
                    <label class="format-card">
                        <input type="radio" name="format-mode" value="inline">
                        <div class="format-info">
                            <strong>Dạng 1: Cùng dòng</strong>
                            <p>Hắn cười: "Được thôi."</p>
                        </div>
                    </label>
                    <label class="format-card">
                        <input type="radio" name="format-mode" value="newline">
                        <div class="format-info">
                            <strong>Dạng 2: Xuống dòng</strong>
                            <p>Hắn cười:<br>"Được thôi."</p>
                        </div>
                    </label>
                    <label class="format-card">
                        <input type="radio" name="format-mode" value="dash">
                        <div class="format-info">
                            <strong>Dạng 3: Gạch đầu dòng</strong>
                            <p>Hắn cười:<br>- Được thôi.</p>
                        </div>
                    </label>
                </div>
            </div>

            <div class="sidebar-group">
              <label>Dữ liệu (CSV)</label>
              <div class="csv-actions">
                <button id="import-settings" class="btn btn-secondary btn-sm">Nhập</button>
                <button id="export-settings" class="btn btn-secondary btn-sm">Xuất</button>
              </div>
            </div>
          </aside>

          <div class="settings-main">
            <div class="sticky-list-header">
                <h3>Cặp Thay Thế</h3>
                <div class="list-btns">
                    <button id="add-pair" class="btn btn-success">+ Thêm mới</button>
                    <button id="save-settings" class="btn btn-primary">Lưu tất cả</button>
                </div>
            </div>
            <div id="punctuation-list" class="pairs-grid"></div>
            <div id="empty-state" class="hidden">Chưa có dữ liệu.</div>
          </div>
        </div>
      </section>

      <section id="replace" class="tab-pane">
        <div class="replace-container">
            <div class="pane">
                <div class="pane-header">Nguồn <span id="input-word-count" class="badge">0 W</span></div>
                <textarea id="input-text" placeholder="Dán văn bản gốc..."></textarea>
                <button id="replace-button" class="btn-main-action">THỰC HIỆN XỬ LÝ</button>
            </div>
            <div class="pane">
                <div class="pane-header">Kết quả <div class="badge-group"><span id="count-replace" class="badge">0 R</span> <span id="count-caps" class="badge">0 C</span></div></div>
                <div id="output-text" class="output-div" data-placeholder="Kết quả..."></div>
                <button id="copy-button" class="btn-success">SAO CHÉP KẾT QUẢ</button>
            </div>
        </div>
      </section>

      <section id="split" class="tab-pane">
        <div class="split-top-bar">
            <div class="split-type-toggle">
                <label><input type="radio" name="split-type" value="count" checked> Theo số phần</label>
                <label><input type="radio" name="split-type" value="regex"> Theo Regex</label>
            </div>
            <div id="split-type-count" class="split-btns">
                <button class="split-num active" data-split="2">2</button>
                <button class="split-num" data-split="4">4</button>
                <button class="split-num" data-split="10">10</button>
            </div>
        </div>
        <div class="split-layout">
            <div class="split-input-box">
                <textarea id="split-input-text" placeholder="Dán nội dung cần chia..."></textarea>
                <button id="split-action-btn" class="btn-primary">Bắt đầu chia</button>
            </div>
            <div id="split-outputs-wrapper" class="split-results"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="notification-container"></div>
  <script src="index.js"></script>
</body>
</html>
